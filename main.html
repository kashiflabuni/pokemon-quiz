<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's that Pokémon?</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Who's that Pokémon?</h1>
        </header>
        <main class="game-main">
            <div class="pokemon-display">
                <img src="favicon.png" id="pokemonImage" alt="Guess the Pokémon">
            </div>
            <div class="options-section">
                <button class="option-btn"><i class="fas fa-dragon"></i> Option 1</button>
                <button class="option-btn"><i class="fas fa-dragon"></i> Option 2</button>
                <button class="option-btn"><i class="fas fa-dragon"></i> Option 3</button>
                <button class="option-btn"><i class="fas fa-dragon"></i> Option 4</button>
            </div>
        </main>
        <footer class="game-footer">
            <div class="scoreboard">
                <p>Score: <strong id="pointsEarn">0</strong>/<span id="totalCount">0</span></p>
            </div>
            <div class="controls">
                <button class="control-btn restart"><i class="fas fa-redo"></i> Restart</button>
                <button class="control-btn pause"><i class="fas fa-pause"></i> Pause</button>
                <button class="control-btn end"><i class="fas fa-stop"></i> End</button>
            </div>
        </footer>
    </div>
</body>
</html>
